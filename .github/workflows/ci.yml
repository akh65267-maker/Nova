name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore NovaCommerce.slnx

      - name: Build (Release)
        run: dotnet build NovaCommerce.slnx --no-restore --configuration Release

      # Run all six unit-test projects in a single invocation.
      # Saga.IntegrationTests is excluded here because it needs Docker
      # (Testcontainers) and runs in its own job below.
      - name: Unit tests
        run: >
          dotnet test NovaCommerce.slnx
          --no-restore
          --configuration Release
          --filter "FullyQualifiedName!~Saga.IntegrationTests"
          --logger "console;verbosity=normal"

  migration-drift:
    runs-on: ubuntu-latest
    # Runs in parallel with build-and-test; no dependency between them.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages and local tools
        # dotnet-ef is declared in .config/dotnet-tools.json; tool restore
        # installs it locally so the 'dotnet ef' command works in subsequent steps.
        run: |
          dotnet restore NovaCommerce.slnx
          dotnet tool restore

      # Checks that every EF DbContext's current model matches the last
      # committed migration. Fails if someone added or changed an entity
      # without running 'dotnet ef migrations add'. Critical here because
      # no service applies migrations at startup - a missed migration fails
      # silently until the service hits the database.
      - name: Check CatalogService migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/Services/CatalogService

      - name: Check InventoryService migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/Services/InventoryService

      - name: Check OrderService migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/Services/OrderService

      - name: Check UserService migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/Services/UserService

      # TaskService is excluded from normal analysis (see docs/README.md)
      # but its migrations are checked here because a broken schema is an
      # operational failure regardless of documentation scope.
      - name: Check TaskService migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/Services/TaskService

  integration-tests:
    runs-on: ubuntu-latest
    # Runs in parallel with the other jobs. Slower than unit tests
    # (~60-90 s) because Testcontainers pulls and starts real Postgres
    # and RabbitMQ images. Kept separate so a flaky integration test
    # doesn't block a fast unit-test pass from being reported.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore NovaCommerce.slnx

      - name: Build (Release)
        run: dotnet build NovaCommerce.slnx --no-restore --configuration Release

      # GitHub-hosted ubuntu-latest runners have Docker installed and the
      # daemon running, so Testcontainers works without any extra setup.
      - name: Integration tests (Saga)
        run: >
          dotnet test tests/Saga.IntegrationTests
          --no-restore
          --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=saga.trx"
        timeout-minutes: 15

      # The log is only visible when signed in to GitHub; annotations are on the run itself, so a
      # failure can be named without opening it. Reads the .trx written above.
      - name: Name the failed tests
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const files = require("child_process").execSync("find tests -name \"*.trx\"").toString().split("\n").filter(Boolean);
            for (const f of files) {
              const xml = fs.readFileSync(f, "utf8");
              const failed = /<UnitTestResult[^>]*testName="([^"]*)"[^>]*outcome="Failed"[\s\S]*?<Message>([\s\S]*?)<\/Message>(?:\s*<StackTrace>([\s\S]*?)<\/StackTrace>)?/g;
              for (const m of xml.matchAll(failed)) {
                const message = m[2].split("\n").slice(0, 6).join(" | ");
                // The first frames say which call failed, which the message alone often does not.
                const stack = (m[3] || "").split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 5).join(" | ");
                const text = (message + (stack ? " || " + stack : "")).replace(/[%\r\n]/g, " ").slice(0, 1200);
                console.log("::error title=Failed test::" + m[1] + ": " + text);
              }
            }'
