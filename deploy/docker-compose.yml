services:
  gateway:
    build:
      context: ../src
      dockerfile: Gateway/ApiGateway/Dockerfile
    container_name: taskflow-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__tasks-cluster__Destinations__destination1__Address: http://tasks-api:8080/
      ReverseProxy__Clusters__users-cluster__Destinations__destination1__Address: http://users-api:8080/
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: http://catalog-api:8080/
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: http://inventory-api:8080/
      ReverseProxy__Clusters__basket-cluster__Destinations__destination1__Address: http://basket-api:8080/
      ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address: http://order-api:8080/
      ReverseProxy__Clusters__assistant-cluster__Destinations__destination1__Address: http://assistant-api:8080/
      # The browser origins allowed to call the API: the shop and the admin app.
      Cors__AllowedOrigins__0: http://localhost:3100
      Cors__AllowedOrigins__1: http://localhost:3200
      # Believe X-Forwarded-For, but only from the Docker networks (the shop's server reaches the
      # gateway from there), so the services' sign-in limits see each caller and not "the shop".
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8080"
    depends_on:
      - tasks-api
      - users-api
      - catalog-api
      - inventory-api
      - basket-api
      - order-api
      - assistant-api
      - jaeger

  tasks-api:
    build:
      context: ../src
      dockerfile: Services/TaskService/Dockerfile
    container_name: taskflow-tasks-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskDatabase: Host=postgres;Port=5432;Database=taskflow;Username=postgres;Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  users-api:
    build:
      context: ../src
      dockerfile: Services/UserService/Dockerfile
    container_name: taskflow-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserDatabase: Host=postgres-users;Port=5432;Database=userflow;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=${USER_DB_POOL_SIZE:-20}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME}
      # Believe the gateway's X-Forwarded-For, but only from the Docker networks, so the login rate
      # limit sees each caller and not "the gateway" (see TrustedForwardedHeaders).
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8081:8080"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  catalog-api:
    build:
      context: ../src
      dockerfile: Services/CatalogService/Dockerfile
    container_name: taskflow-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ProductImages__Directory: /data/product-images
      ConnectionStrings__CatalogDatabase: Host=postgres-catalog;Port=5432;Database=catalogflow;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=${CATALOG_DB_POOL_SIZE:-30}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8082:8080"
    volumes:
      - taskflow-product-images:/data/product-images
    depends_on:
      postgres-catalog:
        condition: service_healthy
      jaeger:
        condition: service_started

  inventory-api:
    build:
      context: ../src
      dockerfile: Services/InventoryService/Dockerfile
    container_name: taskflow-inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=postgres-inventory;Port=5432;Database=inventoryflow;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=${INVENTORY_DB_POOL_SIZE:-30}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8083:8080"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  basket-api:
    build:
      context: ../src
      dockerfile: Services/BasketService/Dockerfile
    container_name: taskflow-basket-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  # Off by default (Assistant__Enabled). To try it: set ASSISTANT_ENABLED=true and start the ollama
  # profile (docker compose --profile ai up -d), then pull the model once:
  # docker exec taskflow-ollama ollama pull qwen2.5:7b
  assistant-api:
    build:
      context: ../src
      dockerfile: Services/AssistantService/Dockerfile
    container_name: taskflow-assistant-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Assistant__Enabled: ${ASSISTANT_ENABLED:-false}
      Assistant__Model: ${ASSISTANT_MODEL:-qwen2.5:7b}
      Assistant__OllamaUrl: http://ollama:11434/
      Assistant__CatalogUrl: http://catalog-api:8080/
      Assistant__BasketUrl: http://basket-api:8080/
      Assistant__OrderUrl: http://order-api:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8086:8080"
    depends_on:
      - jaeger

  ollama:
    image: ollama/ollama:0.12.3
    container_name: taskflow-ollama
    profiles: ["ai"]
    volumes:
      - taskflow-ollama:/root/.ollama

  order-api:
    build:
      context: ../src
      dockerfile: Services/OrderService/Dockerfile
    container_name: taskflow-order-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderDatabase: Host=postgres-order;Port=5432;Database=orderflow;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=${ORDER_DB_POOL_SIZE:-80}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      # Orders are priced from the catalog, not from the caller.
      Catalog__BaseUrl: http://catalog-api:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8085:8080"
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:17
    container_name: taskflow-postgres-users
    environment:
      POSTGRES_DB: userflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - taskflow-postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:17
    container_name: taskflow-postgres-catalog
    environment:
      POSTGRES_DB: catalogflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - taskflow-postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:17
    container_name: taskflow-postgres-inventory
    environment:
      POSTGRES_DB: inventoryflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - taskflow-postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventoryflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:17
    container_name: taskflow-postgres-order
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - taskflow-postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      # Adds rabbitmq_prometheus to the image's default management plugin, which
      # exposes broker and per-queue metrics on 15692 for Prometheus to scrape.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" # Prometheus metrics
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: taskflow-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: taskflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - taskflow-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: taskflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Datasources and dashboards are provisioned from the repository, so a
      # recreated container comes back with everything already wired up.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - taskflow-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # ── Dev tools (profile: tools) ──────────────────────────────────────────
  # Start with: docker compose --profile tools up -d
  # These containers must never be exposed outside a local dev network.
  # Credentials come from deploy/.env - never commit real values.

  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: taskflow-pgadmin
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"   # desktop mode: no login page
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # servers.json is otherwise imported only on first launch, so edits to it
      # (like the PassFile path) never reach an existing pgadmin-data volume.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_PASSWORD: ${POSTGRES_PASSWORD}
    # Writes the pgpass file inside the container rather than bind-mounting one:
    # files mounted from a Windows drive under WSL appear as mode 777, and libpq
    # silently ignores a pgpass that group/other can read. Generating it here
    # also keeps the password off disk. ':' and '\' are escaped per pgpass
    # syntax. All five instances share POSTGRES_PASSWORD, hence one wildcard line.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '*:5432:*:postgres:%s\n' "$$(printf '%s' "$$PGPASS_PASSWORD" | sed 's/[\\:]/\\&/g')" > /tmp/pgpass
        exec /entrypoint.sh
    volumes:
      # Pre-provisions all five Postgres instances so you don't have to add
      # them manually after every container recreate.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - taskflow-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
      - postgres-users
      - postgres-catalog
      - postgres-inventory
      - postgres-order

  redisinsight:
    image: redis/redisinsight:2.70
    container_name: taskflow-redisinsight
    profiles: [tools]
    volumes:
      - taskflow-redisinsight-data:/data
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  taskflow-postgres-data:
  taskflow-postgres-users-data:
  taskflow-postgres-catalog-data:
  taskflow-product-images:
  taskflow-ollama:
  taskflow-postgres-inventory-data:
  taskflow-postgres-order-data:
  taskflow-prometheus-data:
  taskflow-grafana-data:
  taskflow-pgadmin-data:
  taskflow-redisinsight-data:
